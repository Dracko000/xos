set default=0
set timeout=3
search --no-floppy --set=root --file /casper/vmlinuz
insmod all_video
set gfxmode=auto

menuentry "xOS alpha" {
    linux /casper/vmlinuz boot=casper quiet loglevel=3 console=tty0 ---
    initrd /casper/initrd
}

menuentry "xOS alpha (debug)" {
    linux /casper/vmlinuz boot=casper debug loglevel=7 systemd.log_level=debug console=tty0 ---
    initrd /casper/initrd
}
